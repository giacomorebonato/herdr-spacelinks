id = "spacelinks"
name = "Space Links"
version = "0.1.0"
min_herdr_version = "0.9.3"
description = "Per-Space web links in the herdr sidebar"
platforms = ["macos", "linux", "windows"]

[[actions]]
id = "open"
title = "Space links"
contexts = ["workspace"]
command = ["bun", "spacelinks.ts", "open"]

[[actions]]
id = "add"
title = "Add space link"
contexts = ["workspace"]
command = ["bun", "spacelinks.ts", "add"]

[[actions]]
id = "sync"
title = "Sync PR links"
contexts = ["workspace"]
command = ["bun", "spacelinks.ts", "sync"]

[[panes]]
id = "panel"
title = "Space links"
placement = "popup"
width = "70%"
height = 20
command = ["bun", "spacelinks.ts", "panel"]

[[startup]]
command = ["bun", "spacelinks.ts", "apply"]

[[events]]
on = "workspace.focused"
command = ["bun", "spacelinks.ts", "refresh"]

[[events]]
on = "pane.agent_status_changed"
command = ["bun", "spacelinks.ts", "sync"]
